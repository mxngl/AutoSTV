<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STV Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg:           #EDE8E3;
      --surface:      #FEFFFE;
      --surface-alt:  #EAE6E0;
      --surface-hover:#F5F1EC;
      --ink:          #424242;
      --muted:        #6B6B6B;
      --dim:          #A8A8A8;
      --line:         #E0DBD5;
      --accent:       #C46626;
      --accent-soft:  rgba(196,102,38,0.13);
      --header-bg:    #424242;
      --header-text:  #FEFFFE;
      --shadow:       0 1px 4px rgba(0,0,0,.10);
      --shadow-hover: 0 6px 16px rgba(0,0,0,.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: .875rem;
      color: var(--ink);
      background: var(--bg);
    }

    /* ── Header ─────────────────────────────────────── */
    .site-header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--accent);
    }

    .site-header-text { margin: 0; }

    .site-header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--header-text);
    }

    .site-header-sub {
      margin: 3px 0 0;
      font-size: .72rem;
      letter-spacing: .01em;
      color: rgba(255,255,255,.45);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      font-size: .95rem;
      line-height: 1;
      color: rgba(255,255,255,.55);
      pointer-events: none;
      user-select: none;
    }

    .header-sep {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,.18);
      margin: 0 4px;
    }

    .header-last-updated {
      font-size: .72rem;
      color: rgba(255,255,255,.45);
      white-space: nowrap;
    }

    .pdf-export-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 13px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      font-size: .73rem;
      font-weight: 600;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .pdf-export-btn:hover { background: var(--accent); color: #fff; }
    .pdf-export-btn:active { opacity: .85; }
    .pdf-export-btn svg { flex-shrink: 0; }

    /* ── Shell ──────────────────────────────────────── */
    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }

    /* ── Hero ───────────────────────────────────────── */
    .hero {
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero p {
      margin: 0;
      font-size: .88rem;
      line-height: 1.6;
      color: var(--muted);
    }

    /* ── Run list ───────────────────────────────────── */
    .run-list {
      margin-top: 18px;
      display: grid;
      gap: 18px;
    }

    .run-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 22px 24px;
      transition: box-shadow .2s;
    }

    .run-card:hover { box-shadow: var(--shadow-hover); }

    .run-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      margin-bottom: 16px;
    }

    .run-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.1;
    }

    .run-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .03em;
    }

    /* ── Stats ──────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
    }

    .stat-good { background: #eef6f1; border-color: #a8d5b8; }
    .stat-warn { background: #fdf6e8; border-color: #e8c96a; }
    .stat-over { background: #fdf0ec; border-color: #e8a48a; }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .stat-unit {
      font-size: .7rem;
      font-weight: 400;
      color: var(--muted);
      margin-left: 3px;
    }

    .stat-comparison {
      display: block;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(196,102,38,.08);
      font-size: .68rem;
      color: var(--accent);
      line-height: 1.45;
    }

    /* ── Progress bar ───────────────────────────────── */
    .progress-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(0,0,0,.08);
      margin-top: 11px;
      cursor: default;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      max-width: 100%;
      transition: width .5s ease;
    }

    .stat-good .progress-fill { background: #3a9e6a; }
    .stat-warn .progress-fill { background: #c9970a; }
    .stat-over .progress-fill { background: #c0522a; }
    .stat      .progress-fill { background: #8a9fa0; }

    /* ── Assembly panel ─────────────────────────────── */
    .assembly-panel {
      margin: 0 0 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
    }

    .assembly-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    /* ── Toggle buttons ─────────────────────────────── */
    .metric-toggle {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .toggle-btn {
      padding: 5px 14px;
      border: none;
      border-right: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-family: inherit;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .toggle-btn:last-child { border-right: none; }
    .toggle-btn.active     { background: var(--ink); color: var(--surface); }
    .toggle-btn:hover:not(.active) { background: var(--surface-hover); color: var(--ink); }

    /* ── Gallery ────────────────────────────────────── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    /* ── History panel ──────────────────────────────── */
    .history-panel {
      margin: 0 0 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--line);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .history-title {
      margin: 0;
      font-size: .9rem;
      font-weight: 700;
    }

    .history-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .delta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .delta-card {
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .delta-label {
      display: block;
      color: var(--muted);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 5px;
    }

    .delta-value  { font-size: 1rem; font-weight: 600; line-height: 1.2; }
    .delta-positive { color: var(--accent); }
    .delta-negative { color: #2d7a55; }
    .delta-neutral  { color: var(--ink); }

    /* ── Trend chart ────────────────────────────────── */
    .trend-chart {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .trend-legend {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: .8rem;
    }

    .legend-item { display: inline-flex; align-items: center; gap: 6px; }

    .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

    /* ── Chart figures ──────────────────────────────── */
    figure {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .chart-wrap {
      position: relative;
      padding: 16px 16px 8px;
      flex: 1;
      min-height: 0;
    }

    .chart-expand-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .15s, background .15s, color .15s, border-color .15s;
      line-height: 1;
    }

    figure:hover .chart-expand-btn { opacity: 1; }

    .chart-expand-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .chart-download-btn {
      position: absolute;
      top: 10px;
      right: 42px;
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .15s, background .15s, color .15s, border-color .15s;
      line-height: 1;
    }

    figure:hover .chart-download-btn { opacity: 1; }

    .chart-download-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .panel-download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      transition: background .15s, color .15s, border-color .15s;
    }

    .panel-download-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    figcaption {
      padding: 9px 14px 11px;
      font-size: .8rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    /* ── Empty state ────────────────────────────────── */
    .footer-note,
    .empty-state { margin-top: 18px; color: var(--muted); line-height: 1.6; }

    .empty-state {
      display: none;
      padding: 24px;
      border-radius: 8px;
      border: 1px dashed var(--line);
      background: var(--surface);
    }

    /* ── Chart modal ────────────────────────────────── */
    .chart-modal {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .chart-modal[hidden] { display: none; }

    .chart-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
      cursor: pointer;
    }

    .chart-modal-box {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border-radius: 10px;
      box-shadow: 0 24px 64px rgba(0,0,0,.25);
      width: min(920px, 100%);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chart-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-alt);
      flex-shrink: 0;
    }

    .chart-modal-title {
      font-size: .88rem;
      font-weight: 700;
      color: var(--ink);
    }

    .chart-modal-close {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s, border-color .15s;
    }

    .chart-modal-close:hover { background: var(--ink); color: var(--surface); border-color: var(--ink); }

    .chart-modal-body {
      padding: 24px;
      overflow: auto;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chart-modal-body canvas { max-width: 100%; }

    /* ── Hero scorecard ─────────────────────────────── */
    .hero-scorecard {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .hero-metric-label {
      margin: 0 0 4px;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .hero-metric-value {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .hero-metric-value.good { color: #3a9e6a; }
    .hero-metric-value.warn { color: #c9970a; }
    .hero-metric-value.over { color: #c0522a; }

    .hero-metric-sub {
      margin: 4px 0 0;
      font-size: .75rem;
      color: var(--muted);
    }

    .hero-metric-trees {
      margin: 6px 0 0;
      padding: 4px 8px;
      border-radius: 5px;
      background: rgba(196,102,38,.09);
      font-size: .7rem;
      color: var(--accent);
      line-height: 1.4;
    }

    /* ── Tab bar ────────────────────────────────────── */
    .tab-bar {
      display: flex;
      margin-top: 18px;
      border-bottom: 2px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
      gap: 0;
    }

    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      padding: 10px 18px;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }

    .tab-btn:hover:not(.active) { color: var(--ink); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Tab panels ─────────────────────────────────── */
    .run-panels { margin-top: 16px; }
    .tab-panel[hidden] { display: none; }

    /* ── Last-updated badge ─────────────────────────── */
    .tag-muted {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .01em;
    }

    /* ── Theme toggle button ────────────────────────── */
    .theme-toggle {
      display: flex;
      align-items: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .theme-track {
      width: 28px;
      height: 16px;
      border-radius: 8px;
      background: rgba(255,255,255,.22);
      position: relative;
      flex-shrink: 0;
      transition: background .25s;
    }

    .theme-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,.80);
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: transform .25s, background .25s;
    }

    body.dark .theme-track                     { background: var(--accent); }
    body.dark .theme-thumb                     { transform: translateX(12px); background: #fff; }

    /* ── Dark mode variables ────────────────────────── */
    body.dark {
      --bg:           #1a1a1c;
      --surface:      #2a2a2e;
      --surface-alt:  #35353a;
      --surface-hover:#333338;
      --ink:          #e4e4e4;
      --muted:        #9a9a9a;
      --dim:          #585858;
      --line:         #3c3c42;
      --accent:       #D4783A;
      --accent-soft:  rgba(212,120,58,0.20);
      --header-bg:    #111113;
      --header-text:  #e4e4e4;
      --shadow:       0 1px 4px rgba(0,0,0,.30);
      --shadow-hover: 0 6px 16px rgba(0,0,0,.45);
    }

    /* ── Dark mode component overrides ─────────────── */

    /* Semantic stat backgrounds */
    body.dark .stat-good { background: #162519; border-color: #2a5c35; }
    body.dark .stat-warn { background: #221c0e; border-color: #5a4412; }
    body.dark .stat-over { background: #22140f; border-color: #5c2a1a; }

    /* Charts keep a light surface so axis labels stay readable */
    body.dark figure      { background: #f8f6f3; }
    body.dark .chart-wrap { background: #f8f6f3; }

    /* Assembly + trend SVG text — CSS overrides SVG presentation attributes */
    body.dark .assembly-panel svg text { fill: var(--muted); }
    body.dark .trend-chart      text   { fill: var(--muted); }
    body.dark .trend-chart      line   { stroke: rgba(255,255,255,0.10); }

    /* Delta card positive is accent in light mode; keep in dark */
    body.dark .delta-positive { color: var(--accent); }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 720px) {
      .site-header             { padding: 14px 18px; }
      .header-sep,
      .header-last-updated     { display: none; }
      .shell                   { width: calc(100% - 20px); padding-top: 18px; }
      .hero, .run-card         { padding: 16px; }
      .run-header              { flex-direction: column; }
      .chart-expand-btn        { opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-text">
      <h1>STV Dashboard</h1>
      <p class="site-header-sub">Island Team 2026</p>
    </div>
    <div class="header-right">
      <button class="pdf-export-btn" onclick="generateExecutivePDF()" title="Export executive summary as PDF">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 2H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6z"/>
          <polyline points="9 2 9 6 13 6"/>
          <line x1="5.5" y1="9.5" x2="10.5" y2="9.5"/>
          <line x1="5.5" y1="11.5" x2="8.5" y2="11.5"/>
        </svg>
        Export PDF
      </button>
      <div class="header-sep"></div>
      <span class="header-icon">☀</span>
      <button class="theme-toggle" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode">
        <span class="theme-track"><span class="theme-thumb"></span></span>
      </button>
      <span class="header-icon">☽</span>
      <div class="header-sep"></div>
      <span class="header-last-updated" id="header-last-updated"></span>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <p>Sustainability Tracking Value — live results from Revit takeoff exports, updated on every STV run.</p>
      <div id="hero-scorecard" class="hero-scorecard" hidden></div>
    </section>

    <nav id="tab-bar" class="tab-bar" hidden aria-label="STV runs"></nav>
    <div id="run-panels" class="run-panels"></div>

    <section id="empty-state" class="empty-state">
      No STV result folders were found. Generate results into <code>outputs/stv_*/</code> and refresh this page.
    </section>
  </main>

  <div id="chart-modal" class="chart-modal" hidden>
    <div class="chart-modal-backdrop" onclick="closeChartModal()"></div>
    <div class="chart-modal-box">
      <div class="chart-modal-header">
        <span id="chart-modal-title" class="chart-modal-title"></span>
        <button class="chart-modal-close" onclick="closeChartModal()" title="Close">✕</button>
      </div>
      <div class="chart-modal-body">
        <canvas id="chart-modal-canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem("stv-theme") === "dark") document.body.classList.add("dark");

    let _loadedData = [];

    const RUNS = [
      { id: "stv_project", title: "Project STV", subtitle: "Combined project-level result across individual STV runs" },
      { id: "stv_architecture", title: "Architectural STV", subtitle: "Derived from the Revit architecture takeoff" },
      { id: "stv_structural", title: "Structural STV", subtitle: "Derived from the Revit structural schedule" },
      { id: "stv_mep", title: "Mechanical STV", subtitle: "Derived from the Revit MEP takeoff" },
      { id: "stv_example", title: "Example STV", subtitle: "Reference example generated from bundled inputs" }
    ];

    const CHART_METRICS = ["carbon", "energy", "water"];
    const CHART_LABELS  = ["Carbon", "Energy", "Water"];
    const CHART_UNITS   = ["kgCO₂e", "kWh", "L"];
    const CHART_FONT    = "system-ui, -apple-system, sans-serif";
    const CHART_INK     = "#424242";
    const CHART_MUTED   = "#6B6B6B";
    const CHART_GRID    = "rgba(0,0,0,0.07)";

    const CHART_REGISTRY   = {};
    const CHART_INSTANCES  = {};
    const INITIALIZED_TABS = new Set();
    let   _activeTab       = null;

    function switchTab(runId) {
      document.querySelectorAll(".tab-panel").forEach(p => {
        if (p.dataset.tab === runId) p.removeAttribute("hidden");
        else p.setAttribute("hidden", "");
      });
      document.querySelectorAll(".tab-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.tab === runId)
      );
      _activeTab = runId;

      const prefix = `chart-${runId}-`;
      if (!INITIALIZED_TABS.has(runId)) {
        INITIALIZED_TABS.add(runId);
        for (const [id, cfg] of Object.entries(CHART_REGISTRY)) {
          if (!id.startsWith(prefix)) continue;
          const canvas = document.getElementById(id);
          if (canvas) CHART_INSTANCES[id] = new Chart(canvas, { type: cfg.type, data: cfg.data, options: cfg.options });
        }
      } else {
        requestAnimationFrame(() => {
          for (const [id, chart] of Object.entries(CHART_INSTANCES)) {
            if (id.startsWith(prefix)) chart.resize();
          }
        });
      }
    }

    // A mature tree absorbs ~21 kg CO₂/year → ~0.0575 kg/day
    const TREE_KG_PER_DAY    = 21 / 365;
    // Average US home consumes ~10,500 kWh/year
    const HOME_KWH_PER_YEAR  = 10500;
    // Olympic swimming pool holds 2,500,000 L
    const POOL_LITERS        = 2_500_000;

    function fmtBig(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(n >= 100e3 ? 0 : 1) + "k";
      return n.toFixed(n < 10 ? 1 : 0);
    }

    function formatTreeCount(kg)    { return fmtBig(kg / TREE_KG_PER_DAY); }
    function formatHomeCount(kwh)   { return fmtBig(kwh / HOME_KWH_PER_YEAR); }
    function formatPoolCount(liters){ return fmtBig(liters / POOL_LITERS); }

    function buildHeroScorecard(results) {
      const summary = results.metric_summary || {};
      const defs = [
        { key: "carbon", label: "Carbon", unit: "kgCO₂e" },
        { key: "energy", label: "Energy", unit: "kWh"    },
        { key: "water",  label: "Water",  unit: "L"      }
      ];
      return defs.map(({ key, label, unit }) => {
        const pct     = summary[key]?.percent_of_target;
        const project = summary[key]?.project;
        if (pct == null) return "";
        const cls    = pct <= 0.80 ? "good" : pct <= 1.00 ? "warn" : "over";
        const pctStr = percentFormatter.format(pct * 100) + "%";
        const absStr = numberFormatter.format(Math.round(project));
        const comparison =
          key === "carbon" && project != null ? `&#x1F333; = what ${formatTreeCount(project)} trees absorb in a day` :
          key === "energy" && project != null ? `&#x1F3E0; = ${formatHomeCount(project)} avg. homes powered for a year` :
          key === "water"  && project != null ? `&#x1F3CA; = ${formatPoolCount(project)} Olympic swimming pools` : null;
        const treeLine = comparison
          ? `<p class="hero-metric-trees">${comparison}</p>`
          : "";
        return `
          <div class="hero-metric">
            <p class="hero-metric-label">${label}</p>
            <div class="hero-metric-value ${cls}">${pctStr}</div>
            <p class="hero-metric-sub">${absStr} ${unit} of target</p>
            ${treeLine}
          </div>`;
      }).join("");
    }

    function fmtAxis(v) {
      const abs = Math.abs(v);
      if (abs >= 1e6) return (v / 1e6).toFixed(1) + "M";
      if (abs >= 1e3) return (v / 1e3).toFixed(0) + "K";
      return String(Math.round(v));
    }

    function fmtTip(raw, metricIndex) {
      return `${numberFormatter.format(Math.round(raw))} ${CHART_UNITS[metricIndex] ?? ""}`;
    }

    const CHART_CONFIGS = [];

    const emptyState = document.getElementById("empty-state");

    const numberFormatter = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
    const percentFormatter = new Intl.NumberFormat("en-US", { maximumFractionDigits: 1 });
    const dateFormatter = new Intl.DateTimeFormat("en-US", {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });
    const TREND_SERIES = [
      { key: "carbon", label: "Carbon", color: "#b45d3c" },
      { key: "energy", label: "Energy", color: "#6b8a7a" },
      { key: "water", label: "Water", color: "#5d7ea8" }
    ];

    function formatMetric(metric) {
      if (metric == null) {
        return "N/A";
      }
      return numberFormatter.format(metric);
    }

    function formatPercent(value) {
      if (value == null) {
        return "N/A";
      }
      return percentFormatter.format(value * 100) + "%";
    }

    const METRIC_UNITS = {
      carbon: "kgCO₂e",
      energy: "kWh",
      water: "L"
    };

    function percentClass(ratio) {
      if (ratio == null) return "";
      if (ratio <= 0.80) return "stat-good";
      if (ratio <= 1.00) return "stat-warn";
      return "stat-over";
    }

    function metricCard(label, value, unit, extraClass, comparison) {
      const cls = extraClass ? ` ${extraClass}` : "";
      const unitHtml = unit ? `<span class="stat-unit">${unit}</span>` : "";
      const compHtml = comparison ? `<span class="stat-comparison">${comparison}</span>` : "";
      return `
        <div class="stat${cls}">
          <span class="stat-label">${label}</span>
          <span class="stat-value">${value}${unitHtml}</span>
          ${compHtml}
        </div>
      `;
    }

    function progressCard(label, ratio, extraClass) {
      const cls = extraClass ? ` ${extraClass}` : "";
      const pct = ratio != null ? Math.min(ratio * 100, 100) : 0;
      const tooltip = ratio != null ? `${percentFormatter.format(ratio * 100)}% of target` : "N/A";
      return `
        <div class="stat${cls}">
          <span class="stat-label">${label}</span>
          <div class="progress-track" title="${tooltip}">
            <div class="progress-fill" style="width:${pct}%"></div>
          </div>
        </div>
      `;
    }

    const ASSEMBLY_DATA  = {};
    const ASSEMBLY_METRIC = {};
    const HISTORY_DATA   = {};

    function buildAssemblySvg(assemblies, metric) {
      const color = TREND_SERIES.find(s => s.key === metric)?.color ?? "#b45d3c";
      const unit = METRIC_UNITS[metric] ?? "";
      const entries = Object.entries(assemblies)
        .map(([name, vals]) => ({ name, value: vals[metric] ?? 0 }))
        .sort((a, b) => b.value - a.value);

      const maxVal = entries[0]?.value ?? 1;
      const rowH = 34;
      const labelW = 130;
      const barMaxW = 460;
      const valW = 120;
      const padT = 6;
      const padB = 6;
      const svgW = labelW + 10 + barMaxW + 8 + valW;
      const svgH = padT + entries.length * rowH + padB;

      const rows = entries.map((entry, i) => {
        const y = padT + i * rowH;
        const barW = maxVal > 0 ? (entry.value / maxVal) * barMaxW : 0;
        const label = numberFormatter.format(Math.round(entry.value)) + (unit ? " " + unit : "");
        return `
          <text x="${labelW}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="12" fill="#5f6c69">${entry.name}</text>
          <rect x="${labelW + 10}" y="${y + 7}" width="${barW}" height="${rowH - 14}" rx="4" fill="${color}" opacity="0.82">
            <title>${entry.name}: ${label}</title>
          </rect>
          <text x="${labelW + 10 + barW + 7}" y="${y + rowH / 2 + 4}" font-size="11" fill="#5f6c69">${label}</text>
        `;
      }).join("");

      return `
        <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:auto;display:block">
          ${rows}
        </svg>
        <p style="margin:4px 0 0;font-size:0.78rem;color:#5f6c69;text-align:right">${unit}</p>
      `;
    }

    function buildAssemblyChart(items, runId) {
      if (!items || items.length === 0) return "";

      const assemblies = {};
      for (const item of items) {
        const key = item.assembly || "Other";
        if (!assemblies[key]) assemblies[key] = { carbon: 0, energy: 0, water: 0 };
        assemblies[key].carbon += item.embodied_total?.carbon ?? 0;
        assemblies[key].energy += item.embodied_total?.energy ?? 0;
        assemblies[key].water  += item.embodied_total?.water  ?? 0;
      }

      const chartId = `assembly-chart-${runId}`;
      ASSEMBLY_DATA[chartId]  = assemblies;
      ASSEMBLY_METRIC[chartId] = "carbon";

      const dlIcon = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="2" x2="8" y2="11"/><polyline points="4 7 8 11 12 7"/><line x1="3" y1="14" x2="13" y2="14"/></svg>`;

      return `
        <section class="assembly-panel">
          <div class="assembly-header">
            <h3 class="history-title">Assembly Breakdown</h3>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="metric-toggle">
                <button class="toggle-btn active" onclick="switchAssemblyMetric('${chartId}', 'carbon', this)">Carbon</button>
                <button class="toggle-btn" onclick="switchAssemblyMetric('${chartId}', 'energy', this)">Energy</button>
                <button class="toggle-btn" onclick="switchAssemblyMetric('${chartId}', 'water', this)">Water</button>
              </div>
              <button class="panel-download-btn" onclick="downloadAssemblyAsJpg('${chartId}')" title="Download as JPG">${dlIcon}</button>
            </div>
          </div>
          <div id="${chartId}">${buildAssemblySvg(assemblies, "carbon")}</div>
        </section>
      `;
    }

    function switchAssemblyMetric(chartId, metric, btn) {
      const assemblies = ASSEMBLY_DATA[chartId];
      if (!assemblies) return;
      ASSEMBLY_METRIC[chartId] = metric;
      document.getElementById(chartId).innerHTML = buildAssemblySvg(assemblies, metric);
      btn.closest(".metric-toggle").querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    function formatSignedDelta(value) {
      if (value == null || Number.isNaN(value)) {
        return "N/A";
      }
      if (value === 0) {
        return "0";
      }
      const prefix = value > 0 ? "+" : "";
      return prefix + numberFormatter.format(Math.round(value));
    }

    function formatSignedPercentDelta(value) {
      if (value == null || Number.isNaN(value)) {
        return "N/A";
      }
      if (value === 0) {
        return "0.0 pp";
      }
      const prefix = value > 0 ? "+" : "";
      return prefix + percentFormatter.format(value * 100) + " pp";
    }

    function deltaClass(value) {
      if (value == null || Number.isNaN(value) || value === 0) {
        return "delta-neutral";
      }
      return value > 0 ? "delta-positive" : "delta-negative";
    }

    function buildTrendSvg(history, showLabels = false) {
      if (!history || history.length < 2) {
        return `<p class="history-subtitle">Trend chart will appear after at least two recorded runs.</p>`;
      }

      const width = 840;
      const height = showLabels ? 300 : 260;
      const padding = { top: showLabels ? 48 : 20, right: 20, bottom: 34, left: 42 };
      const innerWidth = width - padding.left - padding.right;
      const innerHeight = height - padding.top - padding.bottom;

      const points = TREND_SERIES.flatMap((series) =>
        history.map((entry) => (entry.metric_summary?.[series.key]?.percent_of_target ?? 0) * 100)
      );
      const maxValue = Math.max(...points, 1);

      const makeX = (index) =>
        padding.left + (history.length === 1 ? innerWidth / 2 : (innerWidth * index) / (history.length - 1));
      const makeY = (value) => padding.top + innerHeight - (value / maxValue) * innerHeight;

      const grid = Array.from({ length: 4 }, (_, idx) => {
        const ratio = idx / 3;
        const y = padding.top + innerHeight * ratio;
        const labelValue = maxValue * (1 - ratio);
        return `
          <line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="rgba(31,42,46,0.10)" />
          <text x="${padding.left - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#5f6c69">${percentFormatter.format(labelValue)}%</text>
        `;
      }).join("");

      const labels = history.map((entry, index) => {
        const x = makeX(index);
        const text = dateFormatter.format(new Date(entry.timestamp));
        return `<text x="${x}" y="${height - 10}" text-anchor="middle" font-size="11" fill="#5f6c69">${text}</text>`;
      }).join("");

      // Vertical offsets per series so labels don't overlap
      const labelOffsets = [-14, 0, 14];
      const seriesMarkup = TREND_SERIES.map((series, si) => {
        const values = history.map((entry) => (entry.metric_summary?.[series.key]?.percent_of_target ?? 0) * 100);
        const path = values.map((value, index) => `${index === 0 ? "M" : "L"} ${makeX(index)} ${makeY(value)}`).join(" ");
        const dots = values.map((value, index) => {
          const cx = makeX(index);
          const cy = makeY(value);
          const dot = `<circle cx="${cx}" cy="${cy}" r="${showLabels ? 5 : 4}" fill="${series.color}" />`;
          if (!showLabels) return dot;
          const labelY = cy + labelOffsets[si] - 4;
          const anchor = si === 0 ? "end" : si === 2 ? "start" : "middle";
          const dx = si === 0 ? -8 : si === 2 ? 8 : 0;
          return `${dot}
            <rect x="${cx + dx - (anchor === "middle" ? 22 : 2)}" y="${labelY - 11}" width="44" height="14" rx="3" fill="white" fill-opacity="0.78"/>
            <text x="${cx + dx}" y="${labelY}" text-anchor="${anchor}" font-size="10" font-weight="600" fill="${series.color}">${series.label[0]}: ${percentFormatter.format(value)}%</text>`;
        }).join("");
        return `
          <path d="${path}" fill="none" stroke="${series.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          ${dots}
        `;
      }).join("");

      return `
        <svg class="trend-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="STV trend over time">
          ${showLabels ? `<rect width="${width}" height="${height}" fill="white"/>` : ""}
          ${grid}
          ${seriesMarkup}
          ${labels}
        </svg>
        <div class="trend-legend">
          ${TREND_SERIES.map((series) => `
            <span class="legend-item">
              <span class="legend-swatch" style="background:${series.color}"></span>
              ${series.label}
            </span>
          `).join("")}
        </div>
      `;
    }

    function buildHistoryPanel(history, runId = null) {
      if (!history || history.length === 0) {
        return "";
      }

      const current = history[history.length - 1];
      const previous = history.length > 1 ? history[history.length - 2] : null;
      const deltas = TREND_SERIES.map((series) => {
        const currentMetric = current.metric_summary?.[series.key] || {};
        const previousMetric = previous?.metric_summary?.[series.key] || {};
        const absoluteDelta =
          previous == null ? null : (currentMetric.project ?? 0) - (previousMetric.project ?? 0);
        const percentDelta =
          previous == null ? null : (currentMetric.percent_of_target ?? 0) - (previousMetric.percent_of_target ?? 0);
        return `
          <div class="delta-card">
            <span class="delta-label">${series.label} delta</span>
            <div class="delta-value ${deltaClass(absoluteDelta)}">${formatSignedDelta(absoluteDelta)}</div>
            <div class="history-subtitle ${deltaClass(percentDelta)}">${formatSignedPercentDelta(percentDelta)}</div>
          </div>
        `;
      }).join("");

      const lastRunText = previous
        ? `Latest run ${dateFormatter.format(new Date(current.timestamp))}. Delta is versus ${dateFormatter.format(new Date(previous.timestamp))}.`
        : `Latest run ${dateFormatter.format(new Date(current.timestamp))}. Run again to see deltas over time.`;

      if (runId) HISTORY_DATA[runId] = history;

      const dlIcon = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="2" x2="8" y2="11"/><polyline points="4 7 8 11 12 7"/><line x1="3" y1="14" x2="13" y2="14"/></svg>`;
      const dlBtn = history.length >= 2 && runId
        ? `<button class="panel-download-btn" onclick="downloadTrendAsJpg('${runId}')" title="Download as JPG">${dlIcon}</button>`
        : "";

      return `
        <section class="history-panel">
          <div class="history-header">
            <div>
              <h3 class="history-title">Run History</h3>
              <p class="history-subtitle">${lastRunText}</p>
            </div>
            ${dlBtn}
          </div>
          <div class="delta-grid">
            ${deltas}
          </div>
          ${buildTrendSvg(history)}
        </section>
      `;
    }

    function buildInteractiveCharts(run, results) {
      const summary = results.metric_summary || {};
      const bd      = results.breakdown     || {};
      const team    = results.team          || "";
      const runId   = run.id;

      const axisX = { grid: { color: CHART_GRID }, ticks: { color: CHART_MUTED, font: { family: CHART_FONT, size: 11 } } };
      const axisY = { grid: { color: CHART_GRID }, ticks: { color: CHART_MUTED, font: { family: CHART_FONT, size: 11 }, callback: fmtAxis } };
      const legend = { labels: { color: CHART_INK, font: { family: CHART_FONT, size: 12 }, padding: 16 } };
      const anim   = { duration: 700, easing: "easeOutQuart" };

      // --- Chart 1: Target vs Project grouped bar ---
      const tvpId = `chart-${runId}-tvp`;
      const tvpCfg = {
        id: tvpId, type: "bar",
        caption: "Target vs project impacts",
        data: {
          labels: CHART_LABELS,
          datasets: [
            { label: "Target",  data: CHART_METRICS.map(k => summary[k]?.target  ?? 0), backgroundColor: "rgba(122,143,166,0.60)", borderColor: "#7a8fa6", borderWidth: 1, borderRadius: 4, borderSkipped: false },
            { label: "Project", data: CHART_METRICS.map(k => summary[k]?.project ?? 0), backgroundColor: "rgba(196,102,38,0.72)",  borderColor: "#C46626", borderWidth: 1, borderRadius: 4, borderSkipped: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: anim,
          scales: { x: axisX, y: axisY },
          plugins: {
            legend,
            title: { display: true, text: `STV Performance vs Target — ${team}`, color: CHART_INK, font: { family: CHART_FONT, size: 13, weight: "600" }, padding: { bottom: 14 } },
            tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmtTip(ctx.raw, ctx.dataIndex)}` } }
          }
        }
      };
      CHART_CONFIGS.push(tvpCfg);
      CHART_REGISTRY[tvpId] = tvpCfg;

      // --- Chart 2: Life cycle stacked bar ---
      const bdSegs = [
        { key: "embodied_materials",    label: "Materials",    color: "#5b8e7d" },
        { key: "embodied_transport",    label: "Transport",    color: "#8aa05d" },
        { key: "embodied_construction", label: "Construction", color: "#d2a24c" },
        { key: "use_electricity",       label: "Electricity",  color: "#cc6b49" },
        { key: "use_heating",           label: "Heating",      color: "#8f5f99" },
        { key: "use_water",             label: "Water Use",    color: "#5d7ea8" }
      ];
      const bdId = `chart-${runId}-bd`;
      const bdCfg = {
        id: bdId, type: "bar",
        caption: "Life-cycle impact breakdown",
        data: {
          labels: CHART_LABELS,
          datasets: bdSegs.map(seg => ({
            label: seg.label,
            data:  CHART_METRICS.map(k => bd[seg.key]?.[k] ?? 0),
            backgroundColor: seg.color + "cc",
            borderColor: seg.color,
            borderWidth: 1,
            stack: "stk"
          }))
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: anim,
          scales: {
            x: { ...axisX, stacked: true },
            y: { ...axisY, stacked: true }
          },
          plugins: {
            legend,
            title: { display: true, text: `Life Cycle Impact Breakdown — ${team}`, color: CHART_INK, font: { family: CHART_FONT, size: 13, weight: "600" }, padding: { bottom: 14 } },
            tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmtTip(ctx.raw, ctx.dataIndex)}` } }
          }
        }
      };
      CHART_CONFIGS.push(bdCfg);
      CHART_REGISTRY[bdId] = bdCfg;

      // --- Chart 3: Radar (target vs project %) ---
      const radarId = `chart-${runId}-radar`;
      const projectPcts = CHART_METRICS.map(k => Math.min((summary[k]?.percent_of_target ?? 0) * 100, 200));
      const radarCfg = {
        id: radarId, type: "radar",
        caption: "Target vs project percentages",
        data: {
          labels: CHART_LABELS,
          datasets: [
            { label: "Target (100%)", data: [100, 100, 100], borderColor: "#7a8fa6", backgroundColor: "rgba(122,143,166,0.12)", borderWidth: 2, pointRadius: 4, pointBackgroundColor: "#7a8fa6" },
            { label: "Project",       data: projectPcts,     borderColor: "#C46626", backgroundColor: "rgba(196,102,38,0.22)",  borderWidth: 2, pointRadius: 5, pointBackgroundColor: "#C46626" }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: anim,
          scales: {
            r: {
              min: 0, max: 200,
              ticks: { stepSize: 50, callback: v => v + "%", color: CHART_MUTED, font: { family: CHART_FONT, size: 10 }, backdropColor: "transparent" },
              grid:        { color: CHART_GRID },
              angleLines:  { color: CHART_GRID },
              pointLabels: { color: CHART_INK,  font: { family: CHART_FONT, size: 13, weight: "600" } }
            }
          },
          plugins: {
            legend,
            title: { display: true, text: `Target vs Project Percentage — ${team}`, color: CHART_INK, font: { family: CHART_FONT, size: 13, weight: "600" }, padding: { bottom: 14 } },
            tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.raw.toFixed(1)}%` } }
          }
        }
      };
      CHART_CONFIGS.push(radarCfg);
      CHART_REGISTRY[radarId] = radarCfg;

      const chartIds = [tvpId, bdId, radarId];
      const cfgs     = [tvpCfg, bdCfg, radarCfg];
      const dlIcon   = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="2" x2="8" y2="11"/><polyline points="4 7 8 11 12 7"/><line x1="3" y1="14" x2="13" y2="14"/></svg>`;
      return `
        <div class="gallery">
          ${chartIds.map((id, i) => `
            <figure>
              <div class="chart-wrap">
                <canvas id="${id}"></canvas>

    function buildRunCard(run, results, history) {
      const summary  = results.metric_summary || {};
      const carbon   = summary.carbon || {};
      const energy   = summary.energy || {};
      const water    = summary.water  || {};
      const lifetime = results.lifetime_years != null ? `${results.lifetime_years} yr` : "—";
      const team     = results.team || "Unknown team";

      const lastTs      = history?.length > 0 ? history[history.length - 1].timestamp : null;
      const lastUpdated = lastTs ? dateFormatter.format(new Date(lastTs)) : null;

      return `
        <div class="tab-panel" data-tab="${run.id}">
        <article class="run-card">
          <div class="run-header">
            <div>
              <h2 class="run-title">${run.title}</h2>
              <p class="run-subtitle">${run.subtitle} — ${team}</p>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
              <span class="tag">${lifetime}</span>
              ${lastUpdated ? `<span class="tag-muted">Updated ${lastUpdated}</span>` : ""}
            </div>
          </div>
          <div class="stats">
            ${progressCard("Carbon vs target", carbon.percent_of_target, percentClass(carbon.percent_of_target))}
            ${progressCard("Energy vs target", energy.percent_of_target, percentClass(energy.percent_of_target))}
            ${progressCard("Water vs target", water.percent_of_target, percentClass(water.percent_of_target))}
            ${metricCard("Project carbon", formatMetric(carbon.project), METRIC_UNITS.carbon, "", carbon.project != null ? `&#x1F333; ${formatTreeCount(carbon.project)} trees absorbing/day` : "")}
            ${metricCard("Project energy", formatMetric(energy.project), METRIC_UNITS.energy, "", energy.project != null ? `&#x1F3E0; ${formatHomeCount(energy.project)} homes powered/year` : "")}
            ${metricCard("Project water",  formatMetric(water.project),  METRIC_UNITS.water,  "", water.project  != null ? `&#x1F3CA; ${formatPoolCount(water.project)} Olympic pools` : "")}
          </div>

    let _modalChart = null;

    // ── Chart download helpers ──────────────────────────────────

    function _triggerJpgDownload(canvas, filename) {
      const link = document.createElement("a");
      link.download = filename.replace(/[^a-z0-9_\-]/gi, "_") + ".jpg";
      link.href = canvas.toDataURL("image/jpeg", 0.93);
      link.click();
    }

    // Plugin that draws data labels on top of Chart.js bars/radar points.
    function _makeDataLabelPlugin() {
      return {
        id: "stvDataLabels",
        afterDatasetsDraw(chart) {
          const ctx = chart.ctx;
          const isStacked = !!chart.options.scales?.y?.stacked;
          const isRadar   = chart.config.type === "radar";
          ctx.save();

          if (!isRadar) {
            // Track topmost bar Y per column for stacked-total label
            const colTopY  = {};
            const colTotal = {};

            chart.data.datasets.forEach((ds, dsi) => {
              const meta = chart.getDatasetMeta(dsi);
              if (meta.hidden) return;
              meta.data.forEach((bar, di) => {
                const val = ds.data[di];
                if (!val || val === 0) return;
                const unit  = CHART_UNITS[di] ?? "";
                const label = numberFormatter.format(Math.round(val)) + (unit ? " " + unit : "");

                if (isStacked) {
                  const segH = Math.abs(bar.y - bar.base);
                  if (segH >= 17) {
                    ctx.font = "600 10px system-ui,sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = "rgba(255,255,255,0.92)";
                    ctx.fillText(label, bar.x, (bar.y + bar.base) / 2);
                  }
                  if (colTopY[di] == null || bar.y < colTopY[di]) colTopY[di] = bar.y;
                  colTotal[di] = (colTotal[di] ?? 0) + val;
                } else {
                  ctx.font = "600 11px system-ui,sans-serif";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "bottom";
                  ctx.fillStyle = "#424242";
                  ctx.fillText(label, bar.x, bar.y - 5);
                }
              });
            });

            // Stacked column totals
            if (isStacked) {
              Object.keys(colTotal).forEach(di => {
                const unit  = CHART_UNITS[parseInt(di)] ?? "";
                const label = "Σ " + numberFormatter.format(Math.round(colTotal[di])) + (unit ? " " + unit : "");
                // get x from first visible dataset bar
                let barX = null;
                for (const [, meta] of Object.entries(chart.getDatasetMeta ? {} : {})) { break; }
                for (let dsi = 0; dsi < chart.data.datasets.length; dsi++) {
                  const m = chart.getDatasetMeta(dsi);
                  if (!m.hidden && m.data[di]) { barX = m.data[di].x; break; }
                }
                if (barX == null) return;
                ctx.font = "700 11px system-ui,sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillStyle = "#424242";
                ctx.fillText(label, barX, colTopY[di] - 5);
              });
            }

          } else {
            // Radar: value labels near each point, per dataset
            const yOffsets = [-14, 10, -4];
            chart.data.datasets.forEach((ds, dsi) => {
              const meta = chart.getDatasetMeta(dsi);
              if (meta.hidden) return;
              meta.data.forEach((pt, di) => {
                const val = ds.data[di];
                if (val == null) return;
                ctx.font = "700 11px system-ui,sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = typeof ds.borderColor === "string" ? ds.borderColor : "#424242";
                ctx.fillText(val.toFixed(1) + "%", pt.x, pt.y + (yOffsets[dsi] ?? 0));
              });
            });
          }

          ctx.restore();
        }
      };
    }

    function downloadChartAsJpg(chartId) {
      const cfg = CHART_REGISTRY[chartId];
      if (!cfg) return;

      const isRadar = cfg.type === "radar";
      const W = isRadar ? 680 : 1060;
      const H = isRadar ? 680 : 640;

      const cv = document.createElement("canvas");
      cv.width  = W;
      cv.height = H;

      // Chart.js clears the canvas before drawing, so white background must be
      // applied inside beforeDraw (which runs after clearRect).
      const bgPlugin = {
        id: "stvWhiteBg",
        beforeDraw(chart) {
          chart.ctx.fillStyle = "#ffffff";
          chart.ctx.fillRect(0, 0, chart.width, chart.height);
        }
      };

      // Build options with explicit light-background colours so the image looks
      // clean regardless of the user's current dashboard theme.
      const DL_INK   = "#2e2e2e";
      const DL_MUTED = "#5a5a5a";
      const DL_GRID  = "rgba(0,0,0,0.09)";
      const dlAxisX = { grid: { color: DL_GRID }, ticks: { color: DL_MUTED, font: { family: CHART_FONT, size: 12 } } };
      const dlAxisY = { grid: { color: DL_GRID }, ticks: { color: DL_MUTED, font: { family: CHART_FONT, size: 12 }, callback: fmtAxis } };
      const dlLegend = { labels: { color: DL_INK, font: { family: CHART_FONT, size: 13 }, padding: 18 } };

      const baseOpts = cfg.options;
      const dlOptions = {
        ...baseOpts,
        animation: false,
        responsive: false,
        plugins: {
          ...baseOpts.plugins,
          legend: { ...baseOpts.plugins?.legend, ...dlLegend },
          title:  {
            ...baseOpts.plugins?.title,
            color: DL_INK,
            font: { ...(baseOpts.plugins?.title?.font ?? {}), family: CHART_FONT, size: 14, weight: "700" }
          }
        },
        scales: isRadar
          ? {
              r: {
                ...baseOpts.scales?.r,
                ticks:       { ...(baseOpts.scales?.r?.ticks ?? {}),       color: DL_MUTED, backdropColor: "transparent", font: { family: CHART_FONT, size: 11 } },
                grid:        { color: DL_GRID },
                angleLines:  { color: DL_GRID },
                pointLabels: { color: DL_INK,  font: { family: CHART_FONT, size: 14, weight: "600" } }
              }
            }
          : {
              x: { ...baseOpts.scales?.x, ...dlAxisX, stacked: !!baseOpts.scales?.x?.stacked },
              y: { ...baseOpts.scales?.y, ...dlAxisY, stacked: !!baseOpts.scales?.y?.stacked }
            }
      };

      const tmpChart = new Chart(cv, {
        type: cfg.type,
        data: cfg.data,
        options: dlOptions,
        plugins: [bgPlugin, _makeDataLabelPlugin()]
      });

      _triggerJpgDownload(cv, cfg.caption);
      tmpChart.destroy();
    }

    function _svgToJpg(svgEl, filename) {
      const vb = (svgEl.getAttribute("viewBox") || "0 0 840 300").split(/\s+/).map(Number);
      const vbW = vb[2] || 840;
      const vbH = vb[3] || 300;
      const scale = Math.min(1400 / vbW, 900 / vbH, 3);
      const cW = Math.round(vbW * scale);
      const cH = Math.round(vbH * scale);

      const clone = svgEl.cloneNode(true);
      clone.setAttribute("width",  cW);
      clone.setAttribute("height", cH);
      // Ensure white background in clone
      if (!clone.querySelector("rect[fill='white']")) {
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("width", "100%"); bg.setAttribute("height", "100%"); bg.setAttribute("fill", "white");
        clone.insertBefore(bg, clone.firstChild);
      }

      const svgData = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const url  = URL.createObjectURL(blob);
      const img  = new Image();
      img.onload = () => {
        const cv = document.createElement("canvas");
        cv.width = cW; cv.height = cH;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, cW, cH);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        _triggerJpgDownload(cv, filename);
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    }

    function downloadAssemblyAsJpg(chartId) {
      const container = document.getElementById(chartId);
      const svgEl = container?.querySelector("svg");
      if (!svgEl) return;
      const metric  = ASSEMBLY_METRIC[chartId] || "carbon";
      const metricLabel = { carbon: "Carbon", energy: "Energy", water: "Water" }[metric] || metric;
      _svgToJpg(svgEl, "Assembly_Breakdown_" + metricLabel);
    }

    function downloadTrendAsJpg(runId) {
      const history = HISTORY_DATA[runId];
      if (!history || history.length < 2) return;

      // Insert labeled SVG into a hidden container so the browser parses it properly
      const tmpDiv = document.createElement("div");
      tmpDiv.style.cssText = "position:fixed;left:-9999px;top:0;visibility:hidden";
      tmpDiv.innerHTML = buildTrendSvg(history, true);
      document.body.appendChild(tmpDiv);
      const svgEl = tmpDiv.querySelector("svg");
      if (svgEl) _svgToJpg(svgEl, "STV_Run_History_" + runId);
      // _svgToJpg serialises the SVG immediately; DOM node no longer needed
      document.body.removeChild(tmpDiv);
    }

    async function generateExecutivePDF() {
      if (_loadedData.length === 0) {
        alert("Dashboard data is still loading. Please try again in a moment.");
        return;
      }

      const btn = document.querySelector(".pdf-export-btn");
      const origText = btn.innerHTML;
      btn.textContent = "Generating…";
      btn.disabled = true;

      try {
        const jsPDFLib = window.jspdf?.jsPDF ?? window.jsPDF;
        if (!jsPDFLib) throw new Error("jsPDF library not loaded — check internet connection and refresh.");
        const doc = new jsPDFLib({ unit: "mm", format: "a4" });
        const W = 210, H = 297, ml = 18;
        const cw = W - ml * 2; // 174mm

        // Colors
        const C_ACCENT  = [196, 102, 38];
        const C_DARK    = [66,  66,  66];
        const C_MUTED   = [107, 107, 107];
        const C_BG      = [245, 241, 236];
        const C_LINE    = [224, 219, 213];
        const C_SURFACE = [252, 250, 248];
        const C_GOOD    = [72, 155, 100];
        const C_WARN    = [185, 145, 30];
        const C_OVER    = [190, 70, 55];

        const fmt  = v => new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(Math.round(v));
        const fmtP = v => v != null ? (v * 100).toFixed(1) + "%" : "N/A";
        const statusColor = pct => pct == null ? C_MUTED : pct <= 0.80 ? C_GOOD : pct <= 1.00 ? C_WARN : C_OVER;
        const now = new Intl.DateTimeFormat("en-US", { year: "numeric", month: "long", day: "numeric" }).format(new Date());

        // ── Header band ─────────────────────────────────────────
        doc.setFillColor(C_DARK[0], C_DARK[1], C_DARK[2]);
        doc.rect(0, 0, W, 22, "F");
        doc.setFillColor(C_ACCENT[0], C_ACCENT[1], C_ACCENT[2]);
        doc.rect(0, 22, W, 2, "F");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.setTextColor(255, 255, 255);
        doc.text("STV Executive Summary", ml, 13);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        doc.setTextColor(195, 188, 180);
        doc.text(`Island Team 2026  ·  Generated ${now}`, ml, 19);

        // ── Key Metrics ─────────────────────────────────────────
        const projectEntry = _loadedData.find(e => e.run.id === "stv_project") ?? _loadedData[0];
        const summary = projectEntry.results.metric_summary || {};
        const metricDefs = [
          { key: "carbon", label: "Carbon", unit: "kgCO2e" },
          { key: "energy", label: "Energy", unit: "kWh"    },
          { key: "water",  label: "Water",  unit: "L"      }
        ];

        let y = 28;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
        doc.text("KEY PERFORMANCE METRICS", ml, y);
        y += 5;

        const boxW = 54, boxH = 32, boxGap = 6;
        metricDefs.forEach(({ key, label, unit }, i) => {
          const m = summary[key] || {};
          const pct = m.percent_of_target;
          const project = m.project;
          const x = ml + i * (boxW + boxGap);
          const sc = statusColor(pct);

          doc.setFillColor(C_BG[0], C_BG[1], C_BG[2]);
          doc.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
          doc.setLineWidth(0.25);
          doc.roundedRect(x, y, boxW, boxH, 2, 2, "FD");

          doc.setFillColor(sc[0], sc[1], sc[2]);
          doc.rect(x, y, boxW, 1.5, "F");

          doc.setFont("helvetica", "normal");
          doc.setFontSize(7);
          doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
          doc.text(label.toUpperCase(), x + 4, y + 6.5);

          doc.setFont("helvetica", "bold");
          doc.setFontSize(17);
          doc.setTextColor(sc[0], sc[1], sc[2]);
          doc.text(fmtP(pct), x + 4, y + 16);

          doc.setFont("helvetica", "normal");
          doc.setFontSize(7);
          doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
          if (project != null) doc.text(fmt(project) + " " + unit, x + 4, y + 21.5, { maxWidth: boxW - 6 });

          if (project != null) {
            let compText;
            if (key === "carbon") compText = `= ${formatTreeCount(project)} trees absorbing for 1 day`;
            if (key === "energy") compText = `= ${formatHomeCount(project)} avg. homes powered/year`;
            if (key === "water")  compText = `= ${formatPoolCount(project)} Olympic swimming pools`;
            if (compText) {
              doc.setFillColor(242, 232, 222);
              doc.roundedRect(x + 3, y + 24, boxW - 6, 5.5, 1, 1, "F");
              doc.setFont("helvetica", "normal");
              doc.setFontSize(6.2);
              doc.setTextColor(C_ACCENT[0], C_ACCENT[1], C_ACCENT[2]);
              doc.text(compText, x + 5, y + 27.8, { maxWidth: boxW - 8 });
            }
          }
        });
        y += boxH + 5;

        // ── Comparison context strip ──────────────────────────
        const carbonVal  = summary.carbon?.project;
        const energyVal  = summary.energy?.project;
        const waterVal   = summary.water?.project;
        const stripItems = [
          carbonVal != null ? `Trees absorbing 1 day: ${formatTreeCount(carbonVal)}` : null,
          energyVal != null ? `Homes powered 1 year: ${formatHomeCount(energyVal)}` : null,
          waterVal  != null ? `Olympic pools: ${formatPoolCount(waterVal)}` : null
        ].filter(Boolean);

        if (stripItems.length) {
          doc.setFillColor(242, 232, 222);
          doc.roundedRect(ml, y, cw, 8, 2, 2, "F");
          doc.setFont("helvetica", "normal");
          doc.setFontSize(7);
          doc.setTextColor(C_ACCENT[0], C_ACCENT[1], C_ACCENT[2]);
          const segW = cw / stripItems.length;
          stripItems.forEach((txt, i) => {
            doc.text(txt, ml + i * segW + segW / 2, y + 5, { align: "center", maxWidth: segW - 4 });
          });
          y += 8 + 6;
        } else {
          y += 8;
        }

        // ── Run Performance Table ─────────────────────────────
        doc.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
        doc.setLineWidth(0.3);
        doc.line(ml, y, ml + cw, y);
        y += 5;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
        doc.text("SUSTAINABILITY PERFORMANCE BY SUBSYSTEM", ml, y);
        y += 4;

        const colX = [ml, ml + 62, ml + 96, ml + 128, ml + 152];
        const colHeaders = ["Subsystem", "Carbon", "Energy", "Water", "Status"];
        doc.setFillColor(C_BG[0], C_BG[1], C_BG[2]);
        doc.rect(ml, y, cw, 7, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(C_DARK[0], C_DARK[1], C_DARK[2]);
        colHeaders.forEach((h, i) => doc.text(h, colX[i] + 2, y + 4.5));
        y += 7;

        _loadedData.forEach(({ run, results }, rowIdx) => {
          const s = results.metric_summary || {};
          const cp = s.carbon?.percent_of_target;
          const ep = s.energy?.percent_of_target;
          const wp = s.water?.percent_of_target;

          let overallLabel, overallColor;
          if ([cp, ep, wp].every(v => v != null && v <= 0.80)) {
            overallLabel = "On Track";   overallColor = C_GOOD;
          } else if ([cp, ep, wp].some(v => v != null && v > 1.00)) {
            overallLabel = "Over Target"; overallColor = C_OVER;
          } else {
            overallLabel = "Near Target"; overallColor = C_WARN;
          }

          if (rowIdx % 2 === 0) {
            doc.setFillColor(C_SURFACE[0], C_SURFACE[1], C_SURFACE[2]);
            doc.rect(ml, y, cw, 7, "F");
          }
          doc.setFont("helvetica", "bold");
          doc.setFontSize(7.5);
          doc.setTextColor(C_DARK[0], C_DARK[1], C_DARK[2]);
          doc.text(run.title, colX[0] + 2, y + 4.5);

          [cp, ep, wp].forEach((v, i) => {
            const sc = statusColor(v);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(sc[0], sc[1], sc[2]);
            doc.text(fmtP(v), colX[i + 1] + 2, y + 4.5);
          });

          doc.setTextColor(overallColor[0], overallColor[1], overallColor[2]);
          doc.setFont("helvetica", "bold");
          doc.text(overallLabel, colX[4] + 2, y + 4.5);
          y += 7;
        });
        y += 6;

        // ── Top Assemblies ───────────────────────────────────
        const items = projectEntry.results.construction_items || [];
        if (items.length > 0) {
          doc.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
          doc.line(ml, y, ml + cw, y);
          y += 5;

          doc.setFont("helvetica", "bold");
          doc.setFontSize(7.5);
          doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
          doc.text("TOP ASSEMBLIES BY EMBODIED CARBON", ml, y);
          y += 4;

          const assemblies = {};
          for (const item of items) {
            const key = item.assembly || "Other";
            if (!assemblies[key]) assemblies[key] = 0;
            assemblies[key] += item.embodied_total?.carbon ?? 0;
          }
          const sorted = Object.entries(assemblies).sort((a, b) => b[1] - a[1]).slice(0, 6);
          const maxVal = sorted[0]?.[1] ?? 1;
          const barTrackW = 86;
          const labelColW = 62;

          sorted.forEach(([name, value], i) => {
            const barW = (value / maxVal) * barTrackW;
            if (i % 2 === 0) {
              doc.setFillColor(C_SURFACE[0], C_SURFACE[1], C_SURFACE[2]);
              doc.rect(ml, y, cw, 7, "F");
            }
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7.5);
            doc.setTextColor(C_DARK[0], C_DARK[1], C_DARK[2]);
            doc.text(name, ml + 2, y + 4.5, { maxWidth: labelColW - 4 });

            doc.setFillColor(196, 120, 80);
            doc.roundedRect(ml + labelColW, y + 1.8, Math.max(barW, 0.5), 3.4, 1, 1, "F");

            doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
            doc.text(fmt(value) + " kgCO2e", ml + labelColW + barTrackW + 3, y + 4.5);
            y += 7;
          });
          y += 4;
        }

        // ── Page 1 footer ────────────────────────────────────
        const footerY = H - 18;
        doc.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
        doc.setLineWidth(0.3);
        doc.line(ml, footerY - 4, ml + cw, footerY - 4);

        doc.setFontSize(7);
        doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
        doc.text("Sustainability Tracking Value Dashboard  ·  Island Team 2026", ml, H - 8);
        doc.text(`Generated ${now}`, ml + cw, H - 8, { align: "right" });

        // ── Page 2 — Charts ──────────────────────────────────
        const chartRunId = projectEntry.run.id;
        const pdfChartDefs = [
          { id: `chart-${chartRunId}-tvp`,   canvasW: 800, canvasH: 430 },
          { id: `chart-${chartRunId}-bd`,    canvasW: 800, canvasH: 430 },
          { id: `chart-${chartRunId}-radar`, canvasW: 480, canvasH: 480 }
        ];

        const pdfChartImages = [];
        const tmpDiv = document.createElement("div");
        tmpDiv.style.cssText = "position:fixed;left:-9999px;top:0;width:800px;visibility:hidden";
        document.body.appendChild(tmpDiv);

        for (const def of pdfChartDefs) {
          const cfg = CHART_REGISTRY[def.id];
          if (!cfg) continue;
          const cv = document.createElement("canvas");
          cv.width  = def.canvasW;
          cv.height = def.canvasH;
          tmpDiv.appendChild(cv);
          const tmpChart = new Chart(cv, {
            type: cfg.type,
            data: cfg.data,
            options: { ...cfg.options, animation: false, responsive: false }
          });
          pdfChartImages.push({ imgData: cv.toDataURL("image/png"), caption: cfg.caption, aspect: def.canvasH / def.canvasW });
          tmpChart.destroy();
        }
        document.body.removeChild(tmpDiv);

        if (pdfChartImages.length > 0) {
          doc.addPage();

          doc.setFillColor(C_DARK[0], C_DARK[1], C_DARK[2]);
          doc.rect(0, 0, W, 22, "F");
          doc.setFillColor(C_ACCENT[0], C_ACCENT[1], C_ACCENT[2]);
          doc.rect(0, 22, W, 2, "F");
          doc.setFont("helvetica", "bold");
          doc.setFontSize(18);
          doc.setTextColor(255, 255, 255);
          doc.text("STV Sustainability Charts", ml, 13);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8.5);
          doc.setTextColor(195, 188, 180);
          doc.text(`Island Team 2026  ·  Generated ${now}`, ml, 19);

          let cy = 30;
          doc.setFont("helvetica", "bold");
          doc.setFontSize(7.5);
          doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
          doc.text("PERFORMANCE CHARTS — " + projectEntry.run.title.toUpperCase(), ml, cy);
          cy += 6;

          const halfW = (cw - 6) / 2;  // ~84mm per chart

          // Row 1: target-vs-project + life-cycle breakdown side by side
          const img0 = pdfChartImages[0];
          const img1 = pdfChartImages[1];
          const row1H = img0 ? halfW * img0.aspect : 0;

          if (img0) {
            doc.addImage(img0.imgData, "PNG", ml, cy, halfW, row1H);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
            doc.text(img0.caption, ml + halfW / 2, cy + row1H + 4, { align: "center" });
          }
          if (img1) {
            const h1 = halfW * img1.aspect;
            doc.addImage(img1.imgData, "PNG", ml + halfW + 6, cy, halfW, h1);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
            doc.text(img1.caption, ml + halfW + 6 + halfW / 2, cy + h1 + 4, { align: "center" });
          }
          cy += row1H + 12;

          // Row 2: radar chart centered
          const img2 = pdfChartImages[2];
          if (img2) {
            const radarW = halfW;
            const radarH = radarW * img2.aspect;
            const rx = ml + (cw - radarW) / 2;
            doc.addImage(img2.imgData, "PNG", rx, cy, radarW, radarH);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
            doc.text(img2.caption, rx + radarW / 2, cy + radarH + 4, { align: "center" });
          }

          // Page 2 footer
          doc.setDrawColor(C_LINE[0], C_LINE[1], C_LINE[2]);
          doc.setLineWidth(0.3);
          doc.line(ml, H - 22, ml + cw, H - 22);
          doc.setFontSize(7);
          doc.setTextColor(C_MUTED[0], C_MUTED[1], C_MUTED[2]);
          doc.text("Sustainability Tracking Value Dashboard  ·  Island Team 2026", ml, H - 8);
          doc.text(`Generated ${now}`, ml + cw, H - 8, { align: "right" });
        }

        // ── Save ─────────────────────────────────────────────
        const fileName = `STV_Executive_Summary_${new Date().toISOString().slice(0, 10)}.pdf`;
        doc.save(fileName);
      } catch (err) {
        console.error("PDF generation failed:", err);
        alert("PDF generation failed: " + err.message);
      } finally {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }

    async function loadRun(run) {
      const response = await fetch(`outputs/${run.id}/stv_results.json`, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Missing results for ${run.id}`);
      }
      return response.json();
    }

    async function loadHistory(run) {
      const response = await fetch(`outputs/${run.id}/history.json`, { cache: "no-store" });
      if (!response.ok) {
        return [];
      }
      return response.json();
    }

    async function render() {
      const loaded = [];

      for (const run of RUNS) {
        try {
          const [results, history] = await Promise.all([loadRun(run), loadHistory(run)]);
          loaded.push({ run, results, history });
        } catch (error) {
          console.warn(error);
        }
      }

      if (loaded.length === 0) {
        emptyState.style.display = "block";
        return;
      }
      _loadedData = loaded;

      // Hero scorecard — use project STV if available, else first loaded
      const projectEntry = loaded.find(e => e.run.id === "stv_project") ?? loaded[0];
      const heroEl = document.getElementById("hero-scorecard");
      heroEl.innerHTML = buildHeroScorecard(projectEntry.results);
      heroEl.removeAttribute("hidden");

      // Build all tab panels (populates CHART_REGISTRY as side-effect)
      document.getElementById("run-panels").innerHTML = loaded
        .map(({ run, results, history }) => buildRunCard(run, results, history))
        .join("");
      CHART_CONFIGS.length = 0; // configs are in CHART_REGISTRY; CHART_CONFIGS not needed further

      // Tab bar
      const tabBar = document.getElementById("tab-bar");
      tabBar.innerHTML = loaded
        .map(({ run }) => `<button class="tab-btn" data-tab="${run.id}" onclick="switchTab('${run.id}')">${run.title}</button>`)
        .join("");
      tabBar.removeAttribute("hidden");

      // Activate first tab (lazy-inits its charts)
      switchTab(loaded[0].run.id);

      // Header timestamp — most recent across all loaded runs
      const allTs = loaded.flatMap(({ history }) => (history || []).map(h => h.timestamp)).filter(Boolean);
      if (allTs.length) {
        const latest = new Date(allTs.sort().at(-1));
        const fmt = new Intl.DateTimeFormat("en-GB", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(latest);
        document.getElementById("header-last-updated").textContent = `Last updated: ${fmt}`;
      }
    }

    render();
  </script>
</body>
</html>
